# /common_playbook/roles/certbot/tasks

# ATTENTION ########################
# 以下の値は、各プロジェクトごとに指定すること
#
# {{ certbot.domain }}
# {{ httpd.base_dir }}
#
# Python 3.7 では certbot.packages に '==2.7.4' を指定し、
# certbot.pip_state を present にすること
#
####################################

- name: "install certbot and its plugins into the virtualenv {{ certbot.venv_path }}"
  pip:
    name: "{{ certbot.packages }}"
    state: "{{ certbot.pip_state }}"
    virtualenv: "{{ certbot.venv_path }}"
    virtualenv_command: "{{ certbot.venv_command }}"
  when: certbot.venv_path | length > 0

- name: "link the certbot in the virtualenv to /usr/local/bin/certbot"
  file:
    src: "{{ certbot.venv_path }}/bin/certbot"
    dest: /usr/local/bin/certbot
    state: link
    force: yes
  when: certbot.venv_path | length > 0

- name: "install certbot and its plugins with the system pip3"
  pip:
    name: "{{ certbot.packages }}"
    state: "{{ certbot.pip_state }}"
    executable: pip3
  when: certbot.venv_path | length == 0

- name: "put {{ certbot.auto_update_script_path }}"
  template: src=update_cert.j2 dest="{{ certbot.auto_update_script_path }}" owner=root group=root mode=0744

- name: "create a job that updates certbot certification"
  cron: name="renew certbot certification" month="*/2" hour="2" minute="0" job="{{ certbot.auto_update_script_path }}"
