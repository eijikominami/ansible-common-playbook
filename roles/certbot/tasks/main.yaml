# /common_playbook/roles/certbot/tasks

# ATTENTION ########################
# 以下の値は、各プロジェクトごとに指定すること
#
# {{ certbot.domain }}
# {{ httpd.base_dir }}
#
# Python 3.7 では certbot.packages に '==2.7.4' を指定し、
# certbot.pip_state を present にすること
#
####################################

- name: "install the python that builds the virtualenv"
  package:
    name: "{{ certbot.python_packages }}"
    state: present
  when: certbot.python_packages | length > 0

# pip モジュールは既存の venv をそのまま使い回すため、Python を差し替えても作り直さない
# バージョンが変わったときだけ venv を消して再作成させる
- name: "read the python version behind the existing virtualenv"
  command: "{{ certbot.venv_path }}/bin/python3 --version"
  register: certbot_venv_python_version
  changed_when: false
  failed_when: false
  when: certbot.venv_path | length > 0

- name: "read the python version of the requested interpreter"
  command: "{{ certbot.venv_command.split() | first }} --version"
  register: certbot_requested_python_version
  changed_when: false
  when: certbot.venv_path | length > 0

- name: "remove the virtualenv when it was built with another python"
  file:
    path: "{{ certbot.venv_path }}"
    state: absent
  when:
    - certbot.venv_path | length > 0
    - certbot_venv_python_version.rc | default(1) == 0
    - certbot_venv_python_version.stdout != certbot_requested_python_version.stdout

- name: "install certbot and its plugins into the virtualenv {{ certbot.venv_path }}"
  pip:
    name: "{{ certbot.packages }}"
    state: "{{ certbot.pip_state }}"
    virtualenv: "{{ certbot.venv_path }}"
    virtualenv_command: "{{ certbot.venv_command }}"
  when: certbot.venv_path | length > 0

- name: "link the certbot in the virtualenv to /usr/local/bin/certbot"
  file:
    src: "{{ certbot.venv_path }}/bin/certbot"
    dest: /usr/local/bin/certbot
    state: link
    force: yes
  when: certbot.venv_path | length > 0

- name: "install certbot and its plugins with the system pip3"
  pip:
    name: "{{ certbot.packages }}"
    state: "{{ certbot.pip_state }}"
    executable: pip3
  when: certbot.venv_path | length == 0

# 取得済みかどうかは lineage のディレクトリで判定する
# httpd の設定が証明書を参照するため、この role は httpd より前に置くこと
- name: "check whether the lineage already exists"
  stat:
    path: "/etc/letsencrypt/live/{{ certbot.domain }}/fullchain.pem"
  register: certbot_lineage
  when: certbot.domains | length > 0

- name: "obtain the certificate for {{ certbot.domains | join(' ') }}"
  command: >
    {{ certbot_command }} certonly
    --{{ certbot.authenticator }}
    --cert-name {{ certbot.domain }}
    {{ certbot.domains | map('regex_replace', '^', '-d ') | join(' ') }}
    --non-interactive --agree-tos -m {{ certbot.email }}
  when:
    - certbot.domains | length > 0
    - not certbot_lineage.stat.exists
  vars:
    certbot_command: "{{ (certbot.venv_path + '/bin/certbot') if certbot.venv_path | length > 0 else 'certbot' }}"

- name: "put {{ certbot.auto_update_script_path }}"
  template: src=update_cert.j2 dest="{{ certbot.auto_update_script_path }}" owner=root group=root mode=0744
- name: "install cron"
  package:
    name: "{{ certbot.cron_packages }}"
    state: present

- name: "enable and start cron"
  service:
    name: "{{ certbot.cron_service }}"
    enabled: yes
    state: started

- name: "create a job that updates certbot certification"
  cron: name="renew certbot certification" month="*/2" hour="2" minute="0" job="{{ certbot.auto_update_script_path }}"
