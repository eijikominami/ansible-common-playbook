# /common_playbook/roles/certbot/defaults

certbot:
  auto_update_script_path: /usr/local/bin/update_cert.sh
  domain: example.com
  # pip でインストールするパッケージ
  # Python 3.7 では certbot 2.8.0 以降が動かないため '==2.7.4' を指定する
  packages:
    - certbot
    - certbot-apache
    - certbot-dns-route53
  # packages にバージョンを固定した場合は present を指定
  pip_state: latest
  # virtualenv のパス
  # 空の場合はシステムの pip3 を使う
  venv_path: ''
  venv_command: /usr/bin/python3 -m venv
  # certbot renew に渡す認証プラグイン
  authenticator: dns-route53
  # --cert-name に渡す lineage
  # 空の場合はホスト上の全 lineage を更新する
  cert_name: ''
  # httpd 以外への証明書の配布先
  # cert_src(既定 fullchain.pem), cert_dest, key_src(既定 privkey.pem), key_dest, reload
  deploy_cert_to: []
httpd:
  base_dir: /usr/local/apache2
