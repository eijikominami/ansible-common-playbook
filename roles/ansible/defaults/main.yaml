# /common_playbook/roles/ansible/defaults

ansible:
  config: /etc/ansible/ansible.cfg
  log: /var/log/ansible.log
  # ログは root のみ書き込み可
  log_mode: "0640"
  # ログの世代管理
  logrotate: /etc/logrotate.d/ansible
  logrotate_frequency: weekly
  logrotate_rotate: 4
  # community.general を含む ansible を指定すること
  # ansible-core 単体では ini_file が使えない
  package: ansible
  # AL2023 は ansible を OS 標準のリポジトリで提供するため epel を登録しない
  # 空の場合は enablerepo を渡さない
  enablerepo: "{{ 'epel' if ansible_distribution_major_version is version('2023', '<') else '' }}"
