# /common_playbook/roles/ansible/tasks

# epel_repo の URL は major_version を含むため該当リリースがない環境では解決できない
- name: "add epel repository"
  yum_repository: name=epel description=epel baseurl="{{ epel_repo }}" gpgkey="{{ epel_key }}" gpgcheck={{ gpgcheck }} enabled=no
  when:
    - ansible_architecture is not match("^arm")
    - ansible_distribution_major_version is version('2023', '<')

- name: "add epel repository"
  yum_repository: name=epel description=epel baseurl="{{ epel_repo_arm }}" gpgcheck=no enabled=no
  when:
    - ansible_architecture is match("^arm")
    - ansible_distribution_major_version is version('2023', '<')

- name: "install the latest version of ansible"
  yum:
    name: "{{ ansible.package }}"
    state: latest
    enablerepo: "{{ ansible.enablerepo | default(omit, true) }}"

# state=touch は既存ファイルのタイムスタンプを更新するため preserve を指定
- name: "create ansible log if it does not exist"
  file:
    path: "{{ ansible.log }}"
    state: touch
    owner: root
    group: root
    mode: "{{ ansible.log_mode }}"
    modification_time: preserve
    access_time: preserve

# 追記中のファイルを掴んだままローテートするため copytruncate を指定
- name: "add a logrotate configuration for the ansible log"
  copy:
    dest: "{{ ansible.logrotate }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ ansible.log }} {
          missingok
          notifempty
          {{ ansible.logrotate_frequency }}
          rotate {{ ansible.logrotate_rotate }}
          compress
          delaycompress
          copytruncate
          create {{ ansible.log_mode }} root root
      }

# control_path = %(directory)s/%%h-%%r
#   デフォルト設定の場合、SSH接続時のファイル名サイズ上限（108文字）を超えて以下のエラーが発生する
#   ディレクトリ命名規則を変更してエラーの発生を防ぐ
#   [エラーメッセージ] ControlPath too long
#
# ssh_args = -o UserKnownHostsFile=/dev/null
#   未ログイン端末に初めてログインした場合、以下のようなfingerprintの整合性エラーが発生する
#   fingerprintの保存ファイルを空指定してエラーの発生を防ぐ
#   host_key_checking = Falseが効いていない場合がある
#   [エラーメッセージ] Please add this host's fingerprint to your known_hosts file to manage this host
#
# hash_behaviour = merge
#   vars_filesが複数あった場合は、後優先で置換（replace）されてしまう
#   マージポリシーを統合（marge)に変更してそれぞれの値を取得できるようにする
#
# ini_file を使う理由
#   blockinfile はセクション見出しごと追記するため [defaults] と [ssh_connection] が
#   重複し、configparser が DuplicateSectionError を投げる
#   ini_file は既存セクションに追記するだけなので重複しない
- name: "configure {{ ansible.config }}"
  ini_file:
    path: "{{ ansible.config }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    backup: yes
  loop:
    - section: ssh_connection
      option: control_path
      value: '%(directory)s/%%h-%%r'
    - section: ssh_connection
      option: ssh_args
      value: '-o UserKnownHostsFile=/dev/null'
    - section: defaults
      option: host_key_checking
      value: 'False'
    - section: defaults
      option: log_path
      value: "{{ ansible.log }}"
    - section: defaults
      option: hash_behaviour
      value: 'merge'
