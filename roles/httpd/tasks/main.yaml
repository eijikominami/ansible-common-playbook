# /common_playbook/roles/httpd/tasks

# httpd.compile_from_src が true の場合はソースからビルドする
# 既定を true にしているのは既存プロジェクトの挙動を変えないため

- name: "build Apache from source"
  include_tasks: source.yaml
  when: httpd.compile_from_src | default(true)

- name: "install Apache from the distribution packages"
  include_tasks: package.yaml
  when: not (httpd.compile_from_src | default(true))
