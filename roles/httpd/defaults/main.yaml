# /common_playbook/roles/httpd/defaults

version:
  httpd: 2.4.46
  apr: 1.7.0
  apr_util: 1.6.1
httpd:
  source_url: http://ftp.jaist.ac.jp/pub/apache/httpd/httpd-{{ version.httpd }}.tar.gz
  user: apache
  base_dir: /usr/local/apache2
  doc_root: /usr/local/apache2/htdocs
  conf_dir: /usr/local/apache2/conf
  conf: /usr/local/apache2/conf/httpd.conf
  default_conf: /usr/local/apache2/conf/extra/httpd-default.conf
  mpm_conf: /usr/local/apache2/conf/extra/httpd-mpm.conf
  info_conf: /usr/local/apache2/conf/extra/httpd-info.conf
  ssl_conf: /usr/local/apache2/conf/extra/httpd-ssl.conf
  cgibin: /usr/local/apache2/cgi-bin
  manual: /usr/local/apache2/manual
  log: /var/apache/logs
  logrotate: /etc/logrotate.d/httpd
  htdigest: /usr/local/apache2/secure
  ctlbin: /usr/local/apache2/bin/apachectl
  daemon: /usr/local/apache2/bin/httpd
  server_admin: webmaster@apache.org
  ssl_enabled: false
  ssl_cert_file: /tmp/server.crt
  ssl_key_file: /tmp/server.key
  pass: password
  timeout: 60
  max_keepalive_requests: 100
  keepalive_timeout: 5
  start_servers: 5
  min_spare_servers: 5
  max_spare_servers: 10
  max_request_workers: 250
  server_limit: 256
  max_connections_per_child: 0
  cros: null

  # true の場合はソースからビルドする
  # 既定を true にしているのは既存プロジェクトの挙動を変えないため
  compile_from_src: true

  # 以下は compile_from_src が false のときのみ使う

  # RHEL 系のパッケージ名
  packages:
    - httpd
    - httpd-tools
    - mod_ssl

  # 追加設定の置き場
  conf_d: /etc/httpd/conf.d

  service: httpd

  # 内容を空にするパッケージ同梱の設定
  # autoindex.conf は /icons/ を、welcome.conf は /poweredby.png を公開する
  neutralized_conf:
    - autoindex.conf
    - welcome.conf
    - userdir.conf

  # mod_ssl が置く設定ファイル名
  # role が内容を差し替える
  ssl_conf_filename: ssl.conf

  # PROFILE=SYSTEM は OS の crypto-policies に従う
  ssl_protocol: "-all +TLSv1.2 +TLSv1.3"
  ssl_cipher_suite: "PROFILE=SYSTEM"

  # event と worker MPM で使うスレッド系の値
  min_spare_threads: 25
  max_spare_threads: 75
  threads_per_child: 25
  max_mem_free: 2048

  # null の場合は ansible_hostname を使う
  server_name: null

  # .htaccess を使う場合は All を指定
  allow_override: None
apr:
  source_url: http://ftp.jaist.ac.jp/pub/apache//apr/apr-{{ version.apr }}.tar.gz
apr_util:
  source_url: http://ftp.jaist.ac.jp/pub/apache//apr/apr-util-{{ version.apr_util }}.tar.gz