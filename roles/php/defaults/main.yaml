# /common_playbook/roles/php/defaults

version:
  php: 7.2.18
php:
  source_url: https://php.net/distributions/php-{{ version.php }}.tar.gz
  ini: /etc/php.ini
  configure_options: --enable-mbstring --with-apxs2=/usr/bin/apxs --with-config-file-path=/etc --disable-libxml --disable-xmlwriter --disable-xmlreader --disable-simplexml --disable-xml --disable-dom --without-pear
  extensiondir: /usr/lib64/php/modules
  file_uploads_disabled: false
  max_execution_time: 300
  mysql_enabled: false
  memory_limit: 16M

  # true の場合はソースからビルドする
  # 既定を true にしているのは既存プロジェクトの挙動を変えないため
  compile_from_src: true

  # 以下は compile_from_src が false のときのみ使う

  # 版数を名前に含むディストリビューションでは php8.2-* のように指定する
  packages:
    - php
    - php-fpm
    - php-opcache
    - php-mbstring

  # 追加の .ini を置く場所
  conf_d: /etc/php.d

  # 数字が大きいほど後に読まれる
  ini_filename: 99-ansible.ini

  # PHP 8.2 の mod_php を提供しないディストリビューションがあるため既定で true
  fpm_enabled: true
  fpm_service: php-fpm

  # php-fpm のプロセス数
  # パッケージ既定の max_children は 50 で、1 プロセスあたり 17MB 程度を使う
  # メモリの小さいホストでは上限に達する前に OOM killer に止められる
  # 空の場合はパッケージ既定のままにする
  fpm_pool_conf: /etc/php-fpm.d/www.conf
  fpm_max_children: ''
  fpm_start_servers: ''
  fpm_min_spare_servers: ''
  fpm_max_spare_servers: ''

  # php.ini の既定を上書きする値
  timezone: Asia/Tokyo
  charset: UTF-8
  upload_max_filesize: 2M
  post_max_size: 8M
  max_file_uploads: 20

  # opcache はパッケージの既定で有効
  # 値を変えるときだけ true にする
  opcache_tuning: false
  opcache_memory_consumption: 128
  opcache_max_accelerated_files: 4000
  opcache_revalidate_freq: 2

  # 上記に当てはまらない設定
  extra_settings: {}

httpd:
  compile_from_src: true
