# /common_playbook/roles/php/tasks

# php.compile_from_src が true の場合はソースからビルドする
# 既定を true にしているのは既存プロジェクトの挙動を変えないため
# httpd.compile_from_src とは独立している

- name: "build PHP from source"
  include_tasks: source.yaml
  when: php.compile_from_src | default(true)

- name: "install PHP from the distribution packages"
  include_tasks: package.yaml
  when: not (php.compile_from_src | default(true))
